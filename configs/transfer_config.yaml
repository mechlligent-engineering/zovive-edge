# transfer_main.py settings. Leave base_station.url empty to run with
# NullBaseStationClient (logs instead of sending) — the default so the
# rest of the system runs end to end before a base station exists.
base_station:
  url: ""              # e.g. "http://192.168.1.110:8000"
  api_key: ""
  timeout_sec: 10.0
  # https:// only: verify the server certificate (true), or give a path to a
  # private CA bundle in ca_bundle. Ignored for http:// URLs.
  verify_tls: true
  ca_bundle: ""

transfer:
  poll_interval_sec: 5.0
  batch_size: 10
  retry_initial_backoff_sec: 2.0
  retry_max_backoff_sec: 300.0
  # Video clips (pipeline/clip_extractor.py) are larger than the image
  # alert and finish on their own timeline, so they get their own
  # enable flag, batch size and timeout rather than sharing the image
  # alert's — a slow video upload should never make image alerts wait.
  video_upload_enabled: true
  video_batch_size: 3
  video_upload_timeout_sec: 60.0
  video_retry_initial_backoff_sec: 5.0
  video_retry_max_backoff_sec: 300.0
  # Pi storage vs. base station storage model: the Pi's images/videos
  # are temporary, the base station's copies are the permanent ones.
  # On ACK (a successful send_event/send_video), the local file is
  # deleted; on failure, it's kept and retried (unaffected by this
  # flag either way — that part is unconditional). transfer_main.py
  # forces this off regardless of the value here if base_station.url
  # above is empty, since there's then no real remote copy to rely on.
  delete_local_files_after_ack: true
