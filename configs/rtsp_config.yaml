# CP Plus CP-UNC-TE41ZL6C-VMDS-Q stream settings.
# Fixed encoder profiles, set once on the camera and never changed at
# runtime (changing them restarts every stream, including the live view):
#   sub_stream  - 720p detection stream (low CPU decode cost; the Pi 5 has
#                 no H.264 hardware decoder). Also the live view if the
#                 camera has no third stream.
#   main_stream - 4MP evidence stream.
# width/height/fps below are what the camera encoder is EXPECTED to send.
# capture/rtsp_reader.py reads at the encoder rate and never throttles;
# tools/camera_probe.py reports any mismatch with these values.
camera:
  # Deployment default; ZOVIVE_CAMERA_HOST overrides it per node. Keep the
  # default identical in configs/camera.yaml.
  host: "${ZOVIVE_CAMERA_HOST:-192.168.1.250}"
  username: "${ZOVIVE_CAMERA_USERNAME}"
  password: "${ZOVIVE_CAMERA_PASSWORD}"
  onvif_username: "${ZOVIVE_ONVIF_USERNAME}"
  onvif_password: "${ZOVIVE_ONVIF_PASSWORD}"

  sub_stream:
    url: "rtsp://{user}:{pass}@{host}:554/video/live?channel=1&subtype=1"
    width: 704
    height: 576
    fps: 25

  main_stream:
    url: "rtsp://{user}:{pass}@{host}:554/video/live?channel=1&subtype=0"
    width: 2688
    height: 1520
    fps: 25

reconnect:
  initial_backoff_sec: 1.0
  max_backoff_sec: 30.0
  backoff_multiplier: 2.0
  stall_timeout_sec: 5.0