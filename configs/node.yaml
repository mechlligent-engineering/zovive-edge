# Identity of this edge node. Loaded by utils/config_loader.py (cfg.node).
# Every log line, DB row and alert is attributed using these values.
# Any string may use ${ENV_VAR} or ${ENV_VAR:-default}.
schema_version: 1

node_id: "${ZOVIVE_NODE_ID:-zovive-node-01}"
forest_name: "Example Range"
camera_name: "North Gate"
timezone: "Asia/Kolkata"
tags: []                       # free-form labels, e.g. ["corridor", "waterhole"]

gps:
  latitude: 11.6234           # decimal degrees, -90..90
  longitude: 76.5821          # decimal degrees, -180..180
  altitude_m: 920             # optional

installation:                  # optional section; every field optional
  installed_on: 2026-09-01     # YYYY-MM-DD
  installed_by: "Field Team A"
  mount_height_m: 3.5
  bearing_deg: 45              # compass direction the camera faces, 0..360
  notes: "Mounted on teak tree, solar panel facing south."
