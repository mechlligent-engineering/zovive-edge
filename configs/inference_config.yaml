# Single-stage inference: one model, the 7-species detector
# (ZOVIVE_FINAL_150E). Species come straight from its classes; there is
# no second classifier model.
# Model paths are file names under models/ (paths.MODELS_DIR), never
# relative to the working directory; an absolute path is used as is.
# `classes` MUST be in the detector's output order (its Ultralytics
# model.names); an ONNX model's embedded names are checked against it
# at load time.
detector:
  onnx_path: "detector.onnx"
  hef_path: "detector.hef"
  input_size: 640
  classes:
    - deer
    - gaur
    - leopard
    - elephant
    - sloth_bear
    - tiger
    - wild_boar
  # The detector decodes every class at this threshold.
  confidence_threshold: 0.50
  # Per species, a detection below its own threshold is dropped right after
  # inference, before tracking (inference/class_thresholds.py); a class not
  # listed keeps confidence_threshold. Each must be one of `classes` and at
  # least confidence_threshold. Values chosen on the 679-image test split
  # (docs/PIPELINE_HARDENING_SPEC.md): higher ones cost recall, notably
  # tiger, for no precision gain.
  class_confidence_thresholds:
    elephant: 0.60
    gaur: 0.60
    leopard: 0.55
    wild_boar: 0.55
    tiger: 0.50
    sloth_bear: 0.50
    deer: 0.50
  nms_iou_threshold: 0.45
  # pipeline/stage1_gate.py promotes a track to a real event only when
  # every check passes (see track_state_machine.py):
  # - an animal in at least min_hits_in_window of the last window_size
  #   frames (5 of 7 lets two missed frames, e.g. leaves, through;
  #   window_size equal to min_hits_in_window means strictly consecutive),
  min_hits_in_window: 5
  window_size: 7
  # - seen for at least this long, first to last sighting,
  min_track_duration_sec: 1.0
  # - a box of at least this many original-frame pixels (0 = off; set it
  #   only after measuring real camera frames),
  min_box_area_px: 0
  # - and the track's leading species, averaged over its recent frames,
  #   at or above that species' class_confidence_thresholds value.
  # Per-track cooldown: suppress duplicate events for the same track for
  # this long after its last alert (stops a sleeping tiger alerting forever).
  track_alert_cooldown_sec: 300.0
  # Per-place memory (pipeline/recent_alerts.py): a new track of the same
  # class over an alerted place is the same animal again, not a new alert,
  # until nothing has been seen there for this long. The tracker gives an
  # animal a new track id after every detection gap, so the per-track
  # cooldown alone let one static object alert 59 times in a night
  # (docs/REALERT_SUPPRESSION_SPEC.md).
  realert_window_sec: 300.0

# Stage 2: the species decision for a confirmed track, voted from the
# detector's own per-frame (class, score) results for that track
# (pipeline/stage2_verifier.py). No model runs here.
stage2:
  # Below this voted detector confidence, stage2_verifier reports
  # "unknown_animal" with the snapshot instead of a (possibly wrong)
  # species name. The detector keeps boxes from confidence_threshold (or
  # the species' class_confidence_thresholds value) up.
  # 0.50, the lowest class threshold: stage1_gate only confirms a track
  # whose leading species averages at least that species' threshold over
  # the same frames this vote uses, so a confirmed track keeps its species.
  # Higher, a confirmed tiger, sloth bear or deer track voted below it
  # would become unknown_animal, which alert_policy.yaml
  # send_unknown_animal_alerts: false drops without an alert.
  min_confidence: 0.50
  # Vote over at most this many of the track's most recent frames.
  max_frames_per_track: 10
  # How the per-frame detector results are combined into one species:
  #   average  - each species' summed score / number of frames; highest
  #              wins (a frame voting for another species counts as 0)
  #   majority - each frame votes for its species; most votes wins,
  #              ties broken by summed score
  voting_strategy: "average"

# SAHI (Slicing Aided Hyper Inference) — improves recall on small/far
# animals (distant Wild Boar, Deer) by running the detector on
# overlapping tiles of the frame instead of one downscaled pass, then
# merging results back with NMS. Off by default: it's several detector
# calls per frame instead of one, so only enable it where the extra
# CPU/NPU cost is acceptable. Wraps the existing Detector (ONNX or
# Hailo) transparently — inference/sahi_slicer.py, no changes to
# either backend.
sahi:
  enabled: false
  # A frame already <= tile_size in both dimensions is passed straight
  # through with no slicing (the default 640x360 sub-stream already
  # fits in one 640 tile). Set tile_size SMALLER than your capture
  # resolution to force tiling and recover far/small animals, e.g.
  # tile_size: 320 against the 640x360 sub-stream gives ~2x2 overlapping
  # tiles each seen at double the effective resolution.
  tile_size: 640
  overlap_ratio: 0.2      # fraction of tile_size shared between adjacent tiles
  run_full_frame_pass: true   # also run one full-frame pass to catch large/close animals
  merge_iou_threshold: 0.5    # NMS threshold when merging tile + full-frame detections

model_version: "v0.1.0-unreleased"
