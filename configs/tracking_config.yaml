# bytetrack_wrapper.py tracker tuning.
tracker:
  iou_match_threshold: 0.3
  # Frames a track can go undetected before it's dropped.
  max_age_frames: 15
  # Consecutive hits required before a track is considered "confirmed"
  # (separate from the stage1 3-of-5 animal-presence vote).
  min_hits_to_confirm: 2
